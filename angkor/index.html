<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26301d">
<title>Angkor</title>
<link rel="stylesheet" href="../player.css">
<style>:root{--bg:#26301d;--glow:#9cc46b66}</style>
</head>
<body>
<main class="stage">
  <video src="../videos/angkor.mp4" playsinline autoplay preload="auto"></video>
  <button class="tap" type="button" aria-label="Play Angkor with sound">
    <span>
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="5"/><path d="M40 30 L72 50 L40 70 Z" fill="currentColor"/></svg>
      <span class="label">Tap to play</span>
    </span>
  </button>
</main>
<script src="../player.js"></script>
</body>
</html>
